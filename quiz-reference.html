const DOMAINS={D1:["Agents & Workflows",14.7],D2:["Applications & Integration",33.1],D3:["Claude Code",3.1],D4:["Evals, Testing & Debugging",2.6],D5:["Model Selection & Optimization",16.8],D6:["Prompt & Context Engineering",11],D7:["Security & Safety",8.1],D8:["Tools & MCPs",10.6]};
const EXAM={D1:8,D2:18,D3:2,D4:1,D5:9,D6:6,D7:4,D8:5};
const KEY="ccdv-practice-lab-v2";const ALL=DATA.flatMap((group)=>group.questions.map((x,i)=>({id:group.id+"-"+String(i+1).padStart(3,"0"),d:group.id,topic:x[0],q:x[1],options:x[2],a:x[3],e:x[4],sourceId:x[5],source:DATA.sources[x[5]]})));const BYID=Object.fromEntries(ALL.map(x=>[x.id,x]));const LETTERS="ABCD";const app=document.getElementById("app");
function getSaved(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&typeof x==="object"?x:{stats:{},session:null}}catch{return {stats:{},session:null}}}
let saved=getSaved();saved.stats||={};let session=saved.session||null;function persist(){saved.session=session;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function answered(id){return Array.isArray(session?.answers?.[id])&&session.answers[id].length>0}
function accurate(id){const q=BYID[id],v=session.answers[id]||[];return v.length===q.a.length&&v.every(k=>q.a.includes(k))}
function remember(id,ok){const x=saved.stats[id]||{attempts:0,correct:0,lastWrong:false};x.attempts++;if(ok)x.correct++;x.lastWrong=!ok;saved.stats[id]=x}
function percent(n,t){return t?Math.round(n/t*100):0}
function start(mode,domain="all",amount=20){let ids=[];
 if(mode==="exam"){for(const [d,n]of Object.entries(EXAM))ids.push(...shuffle(ALL.filter(q=>q.d===d)).slice(0,n).map(q=>q.id));ids=shuffle(ids)}
 else {let pool=ALL.filter(q=>domain==="all"||q.d===domain||q.sourceId===domain);if(mode==="weak")pool=pool.filter(q=>saved.stats[q.id]?.lastWrong);ids=shuffle(pool).slice(0,mode==="weak"?pool.length:amount).map(q=>q.id)}
 if(!ids.length)return;session={mode,ids,i:0,answers:{},checked:{},flags:[],created:Date.now(),deadline:mode==="exam"?Date.now()+120*60*1000:null,submitted:false};persist();render();window.scrollTo({top:0,behavior:"smooth"})}
function home(){const attempts=Object.values(saved.stats);const attempted=attempts.filter(s=>s.attempts>0).length;const mastered=attempts.filter(s=>s.attempts>0&&!s.lastWrong).length;const weak=attempts.filter(s=>s.lastWrong).length;
 const cards=Object.entries(DOMAINS).map(([d,[name,w]])=>{const list=ALL.filter(q=>q.d===d);const done=list.filter(q=>saved.stats[q.id]?.attempts);return `<div class="panel domainRow"><span><strong>${d}</strong> ${esc(name)}<br><span class="muted">Exam weight ${w}%</span></span><strong>${done.length}/${list.length}</strong></div>`}).join("");
 app.innerHTML=`<div class="hero"><div class="eyebrow">Built for practical engineers</div><h1>Know the platform.<br>Ship with confidence.</h1><p class="lead">${ALL.length} source-linked practice questions across the 8 domains in Anthropic's public <strong>Claude Certified Developer – Foundations</strong> exam guide. Learn by doing, then test your readiness.</p><div class="pills"><span class="pill">${ALL.length}-question bank</span><span class="pill">53-question mock</span><span class="pill">120-minute exam timer</span><span class="pill">Offline & private</span></div>${session&&!session.submitted?`<button class="primary" data-action="resume" style="margin-top:22px">Resume ${session.mode==="exam"?"mock exam":"practice"} · ${session.i+1}/${session.ids.length}</button>`:""}</div>
 <section class="section"><div class="sectionHead"><h2>Choose your session</h2><span class="muted small">Save & resume automatically</span></div><div class="modes">
 <button class="mode" data-action="start-practice"><div class="num">01</div><strong>Practice mode</strong><p>Instant feedback, explanations and links to primary documentation. Study by exam domain or focus on the new questions from a Skilljar module.</p></button>
 <button class="mode" data-action="start-exam"><div class="num">02</div><strong>Mock exam</strong><p>53 questions proportioned to the official blueprint. 120 minutes. Answers revealed after submission.</p></button>
 <button class="mode" data-action="start-weak" ${weak?"":"disabled"}><div class="num">03</div><strong>Review mistakes</strong><p>${weak?`${weak} questions need another pass.`:"Complete a session to unlock targeted revision."} Retest only your latest missed questions.</p></button></div>
 <div class="config"><label class="small" for="domain">Practice focus</label><select class="select" id="domain"><option value="all">All domains</option><optgroup label="Exam domains">${Object.entries(DOMAINS).map(([id,x])=>`<option value="${id}">${id} · ${esc(x[0])}</option>`).join("")}</optgroup><optgroup label="Skilljar practice">${Object.entries(DATA.sources).filter(([id])=>id.startsWith("skilljar-m")).map(([id,x])=>`<option value="${id}">${esc(x[0])}</option>`).join("")}</optgroup></select><label class="small" for="amount">Questions</label><select class="select" id="amount"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="${ALL.length}">All available</option></select></div></section>
 <section class="section"><div class="sectionHead"><h2>Learning telemetry</h2><button class="ghost small" data-action="reset-stats">Reset progress</button></div><div class="statGrid"><div class="panel stat"><strong>${attempted}/${ALL.length}</strong><span>Questions attempted</span></div><div class="panel stat"><strong>${mastered}</strong><span>Last attempt correct</span></div><div class="panel stat"><strong>${weak}</strong><span>Needs review</span></div><div class="panel stat"><strong>8</strong><span>Exam domains</span></div></div><h3 style="margin-top:25px">Coverage by domain</h3><div class="domainGrid">${cards}</div></section><p class="alert section">Independent study material. The new Skilljar questions are original scenarios based on the lessons reviewed before the first checkpoint in each module. The real exam uses a scaled passing score (720/1000), which cannot be inferred from raw practice percentages.</p>`}
function question(){if(!session||session.submitted)return home();if(session.mode==="exam"&&session.deadline<=Date.now())return finish(true);if(session.i>=session.ids.length)return session.mode==="exam"?examReview():finish(false);const id=session.ids[session.i],x=BYID[id],v=session.answers[id]||[],checked=!!session.checked[id],isExam=session.mode==="exam",isLast=session.i===session.ids.length-1,good=checked&&accurate(id);const progress=session.ids.filter(answered).length;
 const opts=x.options.map((t,n)=>{let status="";if(checked)status=x.a.includes(n)&&v.includes(n)?" good":x.a.includes(n)?" missing":v.includes(n)?" bad":"";else if(v.includes(n))status=" selected";return `<button class="option${status}" data-action="pick" data-value="${n}" aria-pressed="${v.includes(n)}" ${checked?"disabled":""}><span class="letter">${LETTERS[n]}</span><span>${esc(t)}</span></button>`}).join("");const src=x.source;
 let fb="";if(checked)fb=`<div class="feedback ${good?"correct":"wrong"}" role="status"><strong>${good?"Correct — well reasoned.":"Not quite — review the reasoning."}</strong><p>${esc(x.e)}</p><a href="${esc(src[1])}" target="_blank" rel="noopener noreferrer">Study source: ${esc(src[0])} ↗</a></div>`;
 const main=`<div class="qhead"><span>Question ${session.i+1} of ${session.ids.length} · ${esc(session.mode.toUpperCase())}</span><span>${progress} answered</span></div><div class="progress" aria-label="Progress"><i style="width:${percent(session.i+1,session.ids.length)}%"></i></div><div class="panel question" style="margin-top:16px"><span class="badge">${x.d} · ${esc(DOMAINS[x.d][0])}</span><span class="muted small" style="margin-left:8px">${esc(x.topic)}</span><h2>${esc(x.q)}</h2><p class="hint">${x.a.length===1?"Select ONE answer.":`Select exactly ${x.a.length} answers.`}${isExam?" Your choices stay editable until you submit.":" Check your answer to see the explanation."}</p>${opts}${fb}<div class="actions">${session.i>0?`<button class="ghost" data-action="prev">← Previous</button>`:""}${isExam?`<button class="ghost" data-action="flag">${session.flags.includes(id)?"⚑ Flagged":"⚐ Flag for review"}</button><button class="primary" data-action="next">${isLast?"Go to review":"Next →"}</button>`:checked?`<button class="primary" data-action="next">${isLast?"Finish session":"Next question →"}</button>`:`<button class="primary" data-action="check" ${v.length===x.a.length?"":"disabled"}>Check answer</button>`}</div></div>`;
 const grid=session.ids.map((qid,k)=>`<button class="qchip${k===session.i?" current":""}${answered(qid)?" answered":""}${session.flags.includes(qid)?" flagged":""}" data-action="jump" data-value="${k}" title="Question ${k+1}">${k+1}</button>`).join("");
 const side=`<aside class="panel side"><h3>${isExam?"Timed assessment":"Study session"}</h3>${isExam?`<div id="clock" class="clock">${clockText()}</div><p class="small muted">Time remaining</p>`:`<p class="small muted">Immediate rationale and primary-source references after each answer.</p>`}<div class="small muted">${progress}/${session.ids.length} answered · ${session.flags.length} flagged</div><div class="qgrid">${grid}</div>${isExam?`<button class="ghost" data-action="finish">Submit mock exam</button>`:`<button class="ghost" data-action="home">Pause & go home</button>`}</aside>`;
 app.innerHTML=`<div class="split"><div>${main}</div>${side}</div>`}
function clockText(){if(!session?.deadline)return "";const t=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));return `${String(Math.floor(t/3600)).padStart(2,"0")}:${String(Math.floor(t%3600/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`}
function tick(){if(!session||session.submitted||session.mode!=="exam")return;const e=document.getElementById("clock");if(e){e.textContent=clockText();e.classList.toggle("warn",session.deadline-Date.now()<600000)}if(session.deadline<=Date.now())finish(true)}
function finish(timed=false){if(!session||session.submitted)return;session.submitted=true;session.timedOut=timed;session.finished=Date.now();for(const id of session.ids)if(answered(id)&&!session.checked[id])remember(id,accurate(id));persist();results();window.scrollTo({top:0,behavior:"smooth"})}
function results(){if(!session)return home();const ids=session.ids,correct=ids.filter(id=>answered(id)&&accurate(id)),score=percent(correct.length,ids.length);const rows=Object.entries(DOMAINS).map(([d,[name]])=>{const list=ids.filter(id=>BYID[id].d===d);if(!list.length)return "";const ok=list.filter(id=>correct.includes(id)).length;return `<div class="panel domainRow"><span>${d} · ${esc(name)}</span><strong>${ok}/${list.length} (${percent(ok,list.length)}%)</strong></div>`}).join("");
 const rev=ids.map((id,k)=>{const q=BYID[id],v=session.answers[id]||[],ok=accurate(id)&&answered(id);return `<details class="panel review"><summary><span class="badge">${q.d}</span> ${k+1}. ${ok?"✓":"✕"} ${esc(q.q)}</summary><div class="small muted" style="margin:9px 0">Your selection: ${v.length?v.map(n=>LETTERS[n]).join(", "):"Unanswered"} · Correct: ${q.a.map(n=>LETTERS[n]).join(", ")}</div>${q.options.map((t,n)=>`<div class="option${q.a.includes(n)?" good":v.includes(n)?" bad":""}"><span class="letter">${LETTERS[n]}</span><span>${esc(t)}</span></div>`).join("")}<p>${esc(q.e)}</p><a href="${esc(q.source[1])}" target="_blank" rel="noopener noreferrer">${esc(q.source[0])} ↗</a></details>`}).join("");
 app.innerHTML=`<div class="results"><div class="panel padded"><div class="eyebrow">${session.mode==="exam"?"Mock exam report":"Practice session report"}${session.timedOut?" · time expired":""}</div><div class="score" style="margin:16px 0"><div class="ring" style="--score:${score}%"><span>${score}%</span></div><div><h1 style="font-size:36px;margin:0 0 6px">${correct.length} / ${ids.length} correct</h1><p class="muted" style="margin:0">Unofficial practice score · not equivalent to the scaled CCDV-F passing score.</p></div></div><div class="actions"><button class="primary" data-action="home">Back to dashboard</button><button class="ghost" data-action="start-weak">Retake missed questions</button><button class="ghost" data-action="start-exam">New mock exam</button></div></div><section class="section"><h2>Performance by domain</h2><div class="domainGrid">${rows}</div></section><section class="section"><h2>Review every answer</h2><p class="muted">Open an item to see the correct option, rationale and primary documentation.</p>${rev}</section></div>`}
function render(){session&&!session.submitted?question():session?.submitted?results():home();tick()}
document.addEventListener("click",event=>{const el=event.target.closest("[data-action]");if(!el)return;event.preventDefault();const action=el.dataset.action;
 if(action==="theme"){const dark=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=dark?"light":"dark";return}
 if(action==="home"){if(session?.submitted)session=null;persist();return home()}
 if(action==="resume")return render();
 if(action==="reset-stats"){if(confirm("Reset all saved practice history?")){saved.stats={};persist();home()}return}
 if(action==="start-practice"){const d=document.getElementById("domain")?.value||"all",n=+document.getElementById("amount")?.value||20;return start("practice",d,n)}
 if(action==="start-exam")return start("exam");
 if(action==="start-weak")return start("weak");
 if(!session||session.submitted)return;
 const id=session.ids[session.i],q=BYID[id];if(action==="pick"){if(session.checked[id])return;const n=+el.dataset.value,vals=session.answers[id]||[];session.answers[id]=q.a.length===1?[n]:vals.includes(n)?vals.filter(x=>x!==n):vals.length>=q.a.length?[...vals.slice(1),n]:[...vals,n];persist();return question()}
 if(action==="check"){if((session.answers[id]||[]).length!==q.a.length)return;session.checked[id]=true;remember(id,accurate(id));persist();return question()}
 if(action==="prev"){session.i=Math.max(0,session.i-1);persist();return question()}
 if(action==="next"){session.i++;persist();if(session.i>=session.ids.length){if(session.mode==="exam")return examReview();return finish()}return question()}
 if(action==="jump"){if(session.mode!=="exam"&&!session.checked[id])return;session.i=+el.dataset.value;persist();return question()}
 if(action==="flag"){session.flags=session.flags.includes(id)?session.flags.filter(x=>x!==id):[...session.flags,id];persist();return question()}
 if(action==="finish"){if(confirm("Submit your mock exam and reveal the answers?"))finish(false)}
});
function examReview(){const un=session.ids.filter(id=>!answered(id)).length;app.innerHTML=`<div class="panel padded results"><div class="eyebrow">Ready to submit?</div><h1>Review your answer sheet.</h1><p class="lead">${session.ids.length-un} answered · ${un} unanswered · ${session.flags.length} flagged. Time remaining: ${clockText()}.</p><div class="actions"><button class="ghost" data-action="back-to-exam">Review questions</button><button class="primary" data-action="finish">Submit and score</button></div></div>`}
document.addEventListener("click",e=>{if(e.target.closest('[data-action="back-to-exam"]')){e.preventDefault();session.i=0;persist();question()}});
document.addEventListener("keydown",e=>{if(!session||session.submitted||e.altKey||e.metaKey||e.ctrlKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||""))return;if("1234".includes(e.key)&&e.key.length===1){const b=app.querySelector(`[data-action="pick"][data-value="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}else if(e.key==="Enter"&&document.activeElement===document.body){const b=app.querySelector('[data-action="check"]:not(:disabled),[data-action="next"]');if(b)b.click()}});
setInterval(tick,1000);render();
</script>
