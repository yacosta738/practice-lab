name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: 🚀 Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Release summary
        if: steps.release.outputs.release_created == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🎉 Release ${{ steps.release.outputs.tag_name }}

          Version \`${{ steps.release.outputs.version }}\` is published.

          Check the [Releases page](https://github.com/${{ github.repository }}/releases) for the changelog.
          EOF

  post-release:
    name: 🧪 Post-Release Validation
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build site
        run: pnpm run build

      - name: Validation summary
        run: |
          echo "## ✅ Post-Release Validation Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${{ needs.release-please.outputs.version }} builds successfully." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: [release-please, post-release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
