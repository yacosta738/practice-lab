name: Vercel smoke tests

on:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

jobs:
  smoke:
    name: Vercel smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment payload
        env:
          DEPLOYMENT_URL: ${{ github.event.client_payload.url }}
          DEPLOYMENT_SHA: ${{ github.event.client_payload.git.sha }}
          DEPLOYMENT_PROJECT: ${{ github.event.client_payload.project.name }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "Vercel deployment URL is missing"; exit 1; }
          test -n "$DEPLOYMENT_SHA" || { echo "Vercel deployment commit is missing"; exit 1; }
          test "$DEPLOYMENT_PROJECT" = "project-lab" || { echo "Unexpected Vercel project"; exit 1; }

      - name: Checkout trusted smoke-test code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke-test Vercel deployment
        run: pnpm run test:vercel-smoke
        env:
          VERCEL_SMOKE_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
