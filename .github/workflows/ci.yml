name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "22"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Biome
        run: pnpm run lint

  typecheck:
    name: 🔧 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run astro check
        run: pnpm run check

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Vitest
        run: pnpm run test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Build site
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          retention-days: 7

  a11y:
    name: ♿ Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run axe accessibility audit
        run: pnpm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
